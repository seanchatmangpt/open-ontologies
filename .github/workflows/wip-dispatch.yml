name: WIP Repair Dispatcher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/finish-wip-20260730'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-wip-20260730
          fetch-depth: 0

      - name: Regenerate dependency receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          old_lock="$(sha256sum Cargo.lock | awk '{print $1}')"
          cargo generate-lockfile
          new_lock="$(sha256sum Cargo.lock | awk '{print $1}')"
          mkdir -p .wip
          cat > .wip/dependency-boundary.md <<EOF
          # Dependency boundary receipt

          - wasm4pm rev: \`057d5ba24e10c70036fc4742ede55318c7fe6949\`
          - prior lock SHA-256: \`${old_lock}\`
          - regenerated lock SHA-256: \`${new_lock}\`
          - generator: \`cargo generate-lockfile\`
          - moving git branches in Cargo.toml: 0
          EOF
          sed -i 's/^          //' .wip/dependency-boundary.md
          git add Cargo.lock .wip/dependency-boundary.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: regenerate pinned dependency lock receipt'
            git push origin HEAD:agent/finish-wip-20260730
          fi

      - name: Verify dependency and compile boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked --all-targets
          cargo check --locked --all-targets --all-features
