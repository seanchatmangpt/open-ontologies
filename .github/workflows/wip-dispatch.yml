name: WIP Exact-Head Verifier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: wip-exact-head-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'agent/finish-wip-20260730'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/finish-wip-20260730
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Admit compatibility wrapper semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('tools/verify_ggen_standards.py')
          text = verifier.read_text()

          replacement = '''def dead_param_gate_findings(root: Path) -> list[dict[str, Any]]:
              wrapper = root / "tools" / "dead-param-gate.sh"
              findings: list[dict[str, Any]] = []
              if not wrapper.is_file():
                  return [{"path": "tools/dead-param-gate.sh", "detail": "compatibility wrapper missing"}]

              text = wrapper.read_text(encoding="utf-8", errors="replace")
              authority = "cargo test --locked --test dead_param_gate_test"
              if authority not in text:
                  findings.append(
                      {
                          "path": "tools/dead-param-gate.sh",
                          "detail": "wrapper does not delegate to the admitted Rust AST gate",
                      }
                  )
              forbidden = ("rg -n", "grep -", "GATE_LET", "GENERIC_DISCARD")
              for token in forbidden:
                  if token in text:
                      findings.append(
                          {
                              "path": "tools/dead-param-gate.sh",
                              "detail": f"wrapper contains superseded scanner logic: {token}",
                          }
                      )
              return findings
          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )

          if 'def dead_param_gate_findings(' not in text:
              start = text.index('def stale_dead_param_references(')
              end = text.index('\n\ndef verify_contract', start)
              text = text[:start] + replacement + text[end:]

          old = '''    stale_refs = stale_dead_param_references(root)
              checks.append(
                  require(
                      not stale_refs,
                      "GGEN-STD-CI-001",
                      "CI invokes the admitted Rust dead-parameter gate rather than a deleted shell path",
                      findings=stale_refs,
                  )
              )'''
          old = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in old.splitlines()
          )
          new = '''    gate_findings = dead_param_gate_findings(root)
              checks.append(
                  require(
                      not gate_findings,
                      "GGEN-STD-CI-001",
                      "dead-parameter compatibility wrapper delegates only to the admitted Rust AST gate",
                      findings=gate_findings,
                  )
              )'''
          new = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in new.splitlines()
          )

          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('neither legacy nor admitted dead-parameter verification block found')

          verifier.write_text(text)

          red_team = Path('.github/scripts/test_red_team_traps.sh')
          if red_team.is_file():
              red_team.write_text(
                  red_team.read_text().replace(
                      'tools/dead-param-gate.sh exits 1 with',
                      'the delegated Rust AST test exits non-zero with',
                  )
              )
          PY
          cargo fmt --all -- --check
          cargo generate-lockfile

      - name: Persist compatibility checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock tools/verify_ggen_standards.py tools/dead-param-gate.sh
          if [[ -f .github/scripts/test_red_team_traps.sh ]]; then
            git add .github/scripts/test_red_team_traps.sh
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix: admit Rust dead-parameter compatibility boundary'
            git push origin HEAD:agent/finish-wip-20260730
          fi

      - name: Verify constitutional and compile boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_ggen_standards.py
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked --all-targets
          cargo check --locked --all-targets --all-features

      - name: Commit exact-head compile receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .wip
          head_before="$(git rev-parse HEAD)"
          tree_before="$(git rev-parse HEAD^{tree})"
          cat > .wip/dependency-boundary.md <<EOF
          # Dependency and compile boundary receipt

          - candidate before receipt: \`${head_before}\`
          - candidate tree before receipt: \`${tree_before}\`
          - wasm4pm rev: \`057d5ba24e10c70036fc4742ede55318c7fe6949\`
          - lock generator: \`cargo generate-lockfile\`
          - moving git branches in Cargo.toml: 0
          - \`python3 tools/verify_ggen_standards.py\`: exit 0
          - \`cargo metadata --locked --format-version 1 --no-deps\`: exit 0
          - \`cargo check --locked --all-targets\`: exit 0
          - \`cargo check --locked --all-targets --all-features\`: exit 0
          EOF
          sed -i 's/^          //' .wip/dependency-boundary.md
          touch .wip/compile.done
          git add .wip/dependency-boundary.md .wip/compile.done
          git commit -m 'chore: record exact compile receipt'
          git push origin HEAD:agent/finish-wip-20260730
