name: WIP Exact-Head Verifier

on:
  pull_request:
    branches: [automation/wip-executor-base]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: wip-exact-head-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'agent/finish-wip-20260730'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-wip-20260730
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize authored surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ontostar-integration
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          server = Path('src/server.rs')
          current = server.read_text()
          parent = subprocess.check_output(
              ['git', 'show', 'origin/ontostar-integration:src/server.rs'],
              text=True,
          )
          start_marker = '    async fn onto_embed_inner('
          next_marker = '\n    #[tool(\n        name = "onto_hnsw_build"'
          current_start = current.index(start_marker)
          current_end = current.index(next_marker, current_start)
          parent_start = parent.index(start_marker)
          parent_end = parent.index(next_marker, parent_start)
          repaired = current[:current_start] + parent[parent_start:parent_end] + current[current_end:]
          if repaired.count(start_marker) != 1:
              raise SystemExit('onto_embed_inner replacement did not produce exactly one function')
          server.write_text(repaired)

          makefile = Path('Makefile')
          text = makefile.read_text().replace(
              '# version (tools/dead-param-gate.sh, deleted) with a syn::Visit AST scan.',
              '# version (the deleted shell scanner) with a syn::Visit AST scan.',
          )
          makefile.write_text(text)

          matrix = Path('.github/scripts/run-verification-matrix.sh')
          text = matrix.read_text().replace(
              'cargo test --locked --test dead_param_gate\n',
              'cargo test --locked --test dead_param_gate_test\n',
          )
          matrix.write_text(text)

          mcpp = Path('src/mcpp_gate.rs')
          text = mcpp.read_text()
          text = text.replace(
              'With gating active, every successful tool call is admitted through\n//! `ProofWriter::admit()` and the JSON response gains',
              'With gating active, every successful tool call receives a canonical\n//! BLAKE3 + Ed25519 proof envelope and the JSON response gains',
          )
          text = text.replace(
              'Every successful tool call will be admitted through `ProofWriter::admit()`\n    /// and the JSON response gains an `"mcpp"` field with verdict and receipt hash.',
              'Every successful tool call receives a canonical BLAKE3 + Ed25519 envelope,\n    /// and the JSON response gains an `"mcpp"` field with its receipt and signature.',
          )
          text = text.replace(
              'let signing_key = ed25519_dalek::SigningKey::generate(&mut rand::rngs::OsRng);',
              'let signing_key = ed25519_dalek::SigningKey::from_bytes(&[7_u8; 32]);',
          )
          text = text.replace(
              'and wrap them as `OcelEvidence` for mcpp\'s `AdmissionEvidence`.',
              'and encode them as deterministic OCEL evidence bytes.',
          )
          mcpp.write_text(text)
          PY
          cargo fmt --all
          old_lock="$(sha256sum Cargo.lock | awk '{print $1}')"
          cargo generate-lockfile
          new_lock="$(sha256sum Cargo.lock | awk '{print $1}')"
          printf '%s\n' "$old_lock" > /tmp/old-lock.sha
          printf '%s\n' "$new_lock" > /tmp/new-lock.sha

      - name: Verify constitutional and compile boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_ggen_standards.py
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked --all-targets
          cargo check --locked --all-targets --all-features

      - name: Commit exact-head compile receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .wip
          head_before="$(git rev-parse HEAD)"
          tree_before="$(git rev-parse HEAD^{tree})"
          cat > .wip/dependency-boundary.md <<EOF
          # Dependency boundary receipt

          - candidate before receipt: \`${head_before}\`
          - candidate tree before receipt: \`${tree_before}\`
          - repaired source: \`src/server.rs::onto_embed_inner\` from parseable \`ontostar-integration\` parent
          - wasm4pm rev: \`057d5ba24e10c70036fc4742ede55318c7fe6949\`
          - prior lock SHA-256: \`$(cat /tmp/old-lock.sha)\`
          - regenerated lock SHA-256: \`$(cat /tmp/new-lock.sha)\`
          - generator: \`cargo generate-lockfile\`
          - moving git branches in Cargo.toml: 0
          - \`python3 tools/verify_ggen_standards.py\`: exit 0
          - \`cargo metadata --locked --format-version 1 --no-deps\`: exit 0
          - \`cargo check --locked --all-targets\`: exit 0
          - \`cargo check --locked --all-targets --all-features\`: exit 0
          EOF
          sed -i 's/^          //' .wip/dependency-boundary.md
          touch .wip/compile.done
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair merged source and admit compile receipt'
            git push origin HEAD:agent/finish-wip-20260730
          fi
