name: Bible O Star Evidence Boundary

on:
  pull_request:
    paths:
      - 'bible-o-star/**'
      - '.github/workflows/bible-o-star.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-o-star-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install RDF verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends raptor2-utils b3sum
          python -m pip install --disable-pip-version-check 'pyshacl==0.40.0'
      - name: Execute five-stage Bible O Star verifier
        run: bash bible-o-star/scripts/validate_bible_o_star.sh
