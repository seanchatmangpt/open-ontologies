# @generated by tools/ggen_ci.py from ci/ggen-ci.toml; DO NOT EDIT.
name: ggen CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ggen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: nightly-2026-04-15

jobs:
  admission:
    name: admitted exact tree
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install and verify pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 'nightly-2026-04-15' --profile minimal --component rustfmt
          rustup show active-toolchain | grep -F 'nightly-2026-04-15'
      - name: Verify generated CI replay
        run: python3 tools/verify_ggen_ci.py --output target/verifier/ggen-ci-report.json
      - name: Verify repository constitution
        run: python3 tools/verify_ggen_standards.py
      - name: Verify authored Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps

  verification:
    name: unit integration e2e adversarial
    needs: admission
    runs-on: ubuntu-22.04
    env:
      GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run ggen verification matrix
        run: bash .github/scripts/run-verification-matrix.sh

  portable:
    name: portable (${{ matrix.os }})
    needs: admission
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check and test portable core
        shell: bash
        run: |
          cargo check --locked --all-targets
          cargo test --locked --lib

  real-toolchain-smoke:
    name: real toolchain (${{ matrix.os }})
    needs: admission
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Erlang and Terraform on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y terraform
      - name: Install Erlang and Terraform on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install erlang terraform
      - name: Execute real-toolchain falsifiers
        shell: bash
        run: cargo test --locked --test adversarial_real_toolchains -- --nocapture --test-threads=1

  real-groq-sweep:
    name: real Groq sweep (optional external boundary)
    needs: verification
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Execute configured real-Groq tests
        shell: bash
        run: |
          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "GROQ_API_KEY absent; external Groq standing remains UNKNOWN."
            exit 0
          fi
          for test_name in real_groq_chicago_e2e real_groq_ctq real_groq_executive_projection real_groq_mcp_handler real_groq_plan_workflow real_groq_powl real_groq_powl_refine real_groq_solution_spec; do
            cargo test --locked --test "$test_name" -- --nocapture --test-threads=1
          done
          cargo test --locked --test revops_e2e_with_real_groq -- --ignored --nocapture --test-threads=1
