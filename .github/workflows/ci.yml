name: CI

on:
  push:
    branches: [main, ontostar-integration]
  pull_request:
    branches: [main, ontostar-integration]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The bulk of unit + integration + lint coverage is driven by the single
  # exact-head verification matrix. CI here keeps the jobs that need extra
  # toolchains or secrets while preserving the same committed lock graph.

  verification-matrix:
    name: verification matrix
    runs-on: ubuntu-24.04
    env:
      GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ci-verification-matrix
      - name: chmod scripts
        run: chmod +x .github/scripts/*.sh
      - name: run verification matrix
        run: bash .github/scripts/run-verification-matrix.sh

  real-toolchain-smoke:
    name: real-toolchain smoke (${{ matrix.os }})
    needs: verification-matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: real-toolchain-${{ matrix.os }}
      - name: Install Erlang/OTP + Terraform (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y terraform
          erlc -version
          terraform -version
      - name: Install Erlang/OTP + Terraform (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install erlang terraform
          erlc -version
          terraform -version
      - name: cargo test adversarial_real_toolchains
        run: cargo test --locked --test adversarial_real_toolchains -- --nocapture --test-threads=1

  real-groq-sweep:
    name: real-Groq sweep (gated)
    needs: verification-matrix
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: real-groq
      - name: Skip if no Groq key
        if: env.GROQ_API_KEY == ''
        run: |
          echo "::warning::GROQ_API_KEY not present; skipping real-Groq sweep cleanly."
          exit 0
      - name: real_groq_chicago_e2e
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_chicago_e2e -- --nocapture --test-threads=1
      - name: real_groq_ctq
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_ctq -- --nocapture --test-threads=1
      - name: real_groq_executive_projection
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_executive_projection -- --nocapture --test-threads=1
      - name: real_groq_mcp_handler
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_mcp_handler -- --nocapture --test-threads=1
      - name: real_groq_plan_workflow
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_plan_workflow -- --nocapture --test-threads=1
      - name: real_groq_powl
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_powl -- --nocapture --test-threads=1
      - name: real_groq_powl_refine
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_powl_refine -- --nocapture --test-threads=1
      - name: real_groq_solution_spec
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test real_groq_solution_spec -- --nocapture --test-threads=1
      - name: revops_e2e_with_real_groq
        if: env.GROQ_API_KEY != ''
        run: cargo test --locked --test revops_e2e_with_real_groq -- --ignored --nocapture --test-threads=1
