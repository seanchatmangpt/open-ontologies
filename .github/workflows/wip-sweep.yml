name: Dependency Boundary Audit

on:
  push:
    branches: [agent/finish-wip-20260730]
    paths: [.github/wip-trigger]

permissions:
  contents: write

concurrency:
  group: open-ontologies-dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: agent/finish-wip-20260730
          fetch-depth: 1

      - name: Observe dependency and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wip
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path('.')
          TOKENS = (
              'wasm4pm_types',
              'wasm4pm_algos',
              'wasm4pm_cognition',
              'wasm4pm::',
              'mcpp_core',
              'feature = "mcpp"',
              'cfg(feature = "mcpp")',
          )
          TEXT_SUFFIXES = {'.rs', '.toml', '.yml', '.yaml', '.sh', '.py', '.md'}
          EXCLUDED = {'.git', 'target', '.wip'}

          use_sites = []
          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in TEXT_SUFFIXES:
                  continue
              if any(part in EXCLUDED for part in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              except OSError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  if any(token in line for token in TOKENS):
                      use_sites.append({
                          'path': path.as_posix(),
                          'line': lineno,
                          'text': line.strip()[:500],
                      })

          manifest = Path('Cargo.toml').read_text(encoding='utf-8')
          absolute_path_dependencies = []
          for lineno, line in enumerate(manifest.splitlines(), 1):
              if re.search(r'\bpath\s*=\s*"/', line):
                  absolute_path_dependencies.append({
                      'line': lineno,
                      'text': line.strip(),
                  })

          lock_text = Path('Cargo.lock').read_text(encoding='utf-8', errors='replace')
          duplicate_packages = []
          seen = {}
          for block_number, block in enumerate(lock_text.split('[[package]]')[1:], 1):
              def field(name: str):
                  match = re.search(rf'^\s*{name}\s*=\s*"([^"]*)"', block, re.M)
                  return match.group(1) if match else None
              key = (field('name'), field('version'), field('source'))
              if key[0] and key in seen:
                  duplicate_packages.append({
                      'name': key[0],
                      'version': key[1],
                      'source': key[2],
                      'first_block': seen[key],
                      'duplicate_block': block_number,
                  })
              elif key[0]:
                  seen[key] = block_number

          command = ['cargo', 'metadata', '--locked', '--format-version', '1', '--no-deps']
          completed = subprocess.run(command, text=True, capture_output=True, check=False)
          metadata_gate = {
              'command': ' '.join(command),
              'exit': completed.returncode,
              'stdout_tail': completed.stdout[-4000:],
              'stderr_tail': completed.stderr[-4000:],
          }

          branch_sha = subprocess.run(
              ['git', 'rev-parse', 'HEAD'], text=True, capture_output=True, check=True
          ).stdout.strip()
          tree_sha = subprocess.run(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True, capture_output=True, check=True
          ).stdout.strip()

          audit = {
              'schema': 'open-ontologies-dependency-audit/v1',
              'branch_sha': branch_sha,
              'tree_sha': tree_sha,
              'use_sites': use_sites,
              'absolute_path_dependencies': absolute_path_dependencies,
              'duplicate_lock_packages': duplicate_packages,
              'cargo_metadata_gate': metadata_gate,
              'standing': 'BUILD_BROKEN' if metadata_gate['exit'] else 'PARTIAL_ALIVE',
              'standing_reason': (
                  'Cargo metadata does not parse or resolve the admitted dependency graph.'
                  if metadata_gate['exit']
                  else 'Dependency metadata resolves; compilation and runtime evidence remain separate.'
              ),
          }
          Path('.wip/dependency-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          lines = [
              '# Dependency boundary audit',
              '',
              f"- exact commit: `{branch_sha}`",
              f"- exact tree: `{tree_sha}`",
              f"- standing: **{audit['standing']}**",
              f"- absolute path dependencies: **{len(absolute_path_dependencies)}**",
              f"- duplicate lock package keys: **{len(duplicate_packages)}**",
              f"- dependency use sites: **{len(use_sites)}**",
              '',
              '## Cargo metadata',
              '',
              f"Exit: `{metadata_gate['exit']}`",
              '',
              '```text',
              (metadata_gate['stderr_tail'] or metadata_gate['stdout_tail']).strip(),
              '```',
              '',
              '## Absolute path dependencies',
              '',
          ]
          lines.extend(
              f"- `Cargo.toml:{item['line']}` — `{item['text']}`"
              for item in absolute_path_dependencies
          )
          lines.extend(['', '## Duplicate lock package keys', ''])
          lines.extend(
              f"- `{item['name']} {item['version']} {item['source']}` — blocks "
              f"{item['first_block']} and {item['duplicate_block']}"
              for item in duplicate_packages
          )
          lines.extend(['', '## Dependency use sites', ''])
          lines.extend(
              f"- `{item['path']}:{item['line']}` — `{item['text']}`"
              for item in use_sites
          )
          Path('.wip/dependency-audit.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit bounded audit receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .wip/dependency-audit.json .wip/dependency-audit.md
          if git diff --cached --quiet; then
            echo 'dependency audit unchanged'
            exit 0
          fi
          git commit -m 'chore: record dependency boundary audit'
          git push origin HEAD:agent/finish-wip-20260730
