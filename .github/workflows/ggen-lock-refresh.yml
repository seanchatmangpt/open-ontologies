name: ggen Lock Refresh

on:
  push:
    branches: [agent/ggen-standards-v26.7.31]
    paths: [.github/ggen-lock-trigger]

permissions:
  contents: write

concurrency:
  group: ggen-lock-refresh
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  brce-lock-refresh:
    name: receipted lock refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact granted branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/ggen-standards-v26.7.31
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Record pre-actuation intent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ggen-standards
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          intent = {
              'schema': 'chatmangpt.brce-intent/v1',
              'operation': 'cargo_lock_refresh',
              'repository': 'seanchatmangpt/open-ontologies',
              'branch': 'agent/ggen-standards-v26.7.31',
              'input_commit': head,
              'input_tree': tree,
              'bounded_paths': ['Cargo.lock', 'artifacts/ggen-standards/lock-refresh.json'],
              'idempotency_key': f'open-ontologies:ggen-lock-refresh:{head}',
              'external_product_actuation': False,
          }
          Path('artifacts/ggen-standards/lock-refresh-intent.json').write_text(
              json.dumps(intent, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Regenerate dependency lock
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Verify lock and emit consequence receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_ggen_standards.py --contract-only
          python3 - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          text = Path('Cargo.lock').read_text(errors='replace')
          seen = set()
          duplicates = []
          for number, block in enumerate(text.split('[[package]]')[1:], 1):
              def field(name):
                  match = re.search(rf'^\s*{name}\s*=\s*"([^"]*)"', block, re.M)
                  return match.group(1) if match else None
              key = (field('name'), field('version'), field('source'))
              if key[0] and key in seen:
                  duplicates.append({'identity': key, 'block': number})
              elif key[0]:
                  seen.add(key)
          if duplicates:
              raise SystemExit(f'duplicate package identities: {duplicates}')
          lock_bytes = Path('Cargo.lock').read_bytes()
          intent = json.loads(Path('artifacts/ggen-standards/lock-refresh-intent.json').read_text())
          receipt = {
              'schema': 'chatmangpt.brce-receipt/v1',
              'operation': intent['operation'],
              'idempotency_key': intent['idempotency_key'],
              'input_commit': intent['input_commit'],
              'input_tree': intent['input_tree'],
              'cargo_lock_sha256': hashlib.sha256(lock_bytes).hexdigest(),
              'package_identity_count': len(seen),
              'duplicate_package_identities': 0,
              'cargo_metadata_locked': 'PASS',
              'bounded_standing': 'PARTIAL_ALIVE',
              'external_release_standing': 'UNKNOWN',
          }
          Path('artifacts/ggen-standards/lock-refresh.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Commit atomic lock consequence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/ggen-lock-trigger .github/workflows/ggen-lock-refresh.yml
          git add Cargo.lock artifacts/ggen-standards/lock-refresh-intent.json artifacts/ggen-standards/lock-refresh.json
          git commit -m 'build: refresh portable dependency lock with receipt'
          git push origin HEAD:agent/ggen-standards-v26.7.31
