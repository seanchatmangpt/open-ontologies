name: Executable WIP Inventory

on:
  pull_request:
    paths:
      - 'src/**'
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'tools/**'
      - '.specify/**'
      - 'ontology/**'
      - 'ggen.toml'
      - 'Cargo.toml'
      - '.github/workflows/wip-residual-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inventory executable WIP markers
        run: python3 tools/inventory_wip.py
