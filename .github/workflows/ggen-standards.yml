name: ggen Standards v26.7.31

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.chatmangpt/**'
      - 'standards/**'
      - 'tools/verify_ggen_standards.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  constitutional-admission:
    name: constitutional admission
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify bounded ggen contract
        run: python3 tools/verify_ggen_standards.py --contract-only

  dependency-observation:
    name: dependency observation
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Inventory local-only dependency use sites
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -E 'wasm4pm_types|wasm4pm_algos|wasm4pm_cognition|wasm4pm::|mcpp_core|cfg\(feature = "mcpp"\)' -- '*.rs' '*.toml' '*.yml' '*.yaml' || true
      - name: Observe locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps
