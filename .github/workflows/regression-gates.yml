name: regression-gates

on:
  push:
    branches: [main, ontostar-integration]
  pull_request:
    branches: [main, ontostar-integration]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  verification-matrix:
    name: verification matrix (single source of truth)
    runs-on: ubuntu-24.04
    env:
      GITHUB_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: regression-gates
      - name: chmod scripts
        run: chmod +x .github/scripts/*.sh
      - name: run verification matrix
        run: bash .github/scripts/run-verification-matrix.sh
