name: Materialize exact rustfmt repair

on:
  push:
    branches:
      - agent/dflss-dmedi-arxiv-20260814
    paths:
      - '.github/workflows/format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly-2026-06-22
        with:
          components: rustfmt
      - name: Format exact workspace
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
      - name: Remove transport workflow and publish repair
        run: |
          set -euo pipefail
          rm .github/workflows/format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting delta.'
            exit 0
          fi
          git commit -m 'fix(fmt): satisfy exact workspace formatting gate'
          git push origin HEAD:${{ github.ref_name }}
