name: A2A Core Tool Boundary

on:
  push:
    branches: [main]
    paths:
      - 'src/a2a/**'
      - 'src/server.rs'
      - 'src/inputs.rs'
      - 'src/main.rs'
      - '.github/workflows/a2a-boundary.yml'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: a2a-boundary-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify real A2A handler witnesses and refusals
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked a2a::handler -- --nocapture
          cargo check --locked --all-targets
