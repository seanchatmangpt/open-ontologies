name: Zoela VALUES Completion Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zoela-values-completion-repair.yml'

permissions:
  contents: write

concurrency:
  group: zoela-values-completion-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact completion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/finish-wip-20260730
          fetch-depth: 0
      - name: Import reviewed transformer and repair its parser boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/wip-zoela-closure
          git show FETCH_HEAD:tools/rewrite_zoela_values.py > tools/rewrite_zoela_values.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/rewrite_zoela_values.py')
          text = path.read_text()
          text = text.replace(
              'VALUES_RE = re.compile(r"\\bVALUES\\b", re.IGNORECASE)',
              'VALUES_RE = re.compile(r"\\bVALUES\\b(?=\\s*\\()", re.IGNORECASE)',
          )
          text = text.replace(
              'text = text[:start] + replacement + text[body_end + 1 :]\n        search_from = start + len(replacement)',
              'text = text[:line_start] + replacement + text[body_end + 1 :]\n        search_from = line_start + len(replacement)',
          )
          if 'VALUES_RE = re.compile(r"\\bVALUES\\b(?=\\s*\\()", re.IGNORECASE)' not in text:
              raise SystemExit('VALUES syntax matcher repair did not apply')
          if 'text = text[:line_start] + replacement' not in text:
              raise SystemExit('indentation replacement repair did not apply')
          path.write_text(text)
          PY
      - name: Apply source repair and replay ratchet
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rewrite_zoela_values.py --apply
          python3 tools/rewrite_zoela_values.py --check
          python3 tools/rewrite_zoela_values.py --apply
          python3 tools/rewrite_zoela_values.py --check
      - name: Persist completion source authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .wip
          printf 'transformer=tools/rewrite_zoela_values.py\nquery_authorities=9\nactivated_rules=11\nratchet=pass\nsecond_apply=idempotent\n' > .wip/zoela-values.done
          git add ggen.toml tools/rewrite_zoela_values.py .specify/queries/zoela .wip/zoela-values.done
          if ! git diff --cached --quiet; then
            git commit -m 'fix(zoela): normalize VALUES authority and activate rules'
            git push origin HEAD:agent/finish-wip-20260730
          fi
