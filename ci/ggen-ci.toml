schema = "chatmangpt.ggen-ci/v1"
workflow_name = "ggen CI"
source = "ci/ggen-ci.toml"
generator = "tools/ggen_ci.py"
generated_workflow = ".github/workflows/ci.yml"
verifier_report = "target/verifier/ggen-ci-report.json"

[toolchain]
rust = "nightly-2026-04-15"
python = "3.12"

[actions]
checkout = "11d5960a326750d5838078e36cf38b85af677262"
setup_python = "a26af69be951a213d495a4c3e4e4022e16d87065"

[admission]
commands = [
  "python3 tools/verify_ggen_ci.py --output target/verifier/ggen-ci-report.json && rm -f Cargo.lock && cargo generate-lockfile && python3 tools/verify_ggen_standards.py && cargo metadata --locked --format-version 1 --no-deps >/tmp/cargo-metadata.json && echo LOCK_B64_BEGIN && base64 -w0 Cargo.lock && echo && echo LOCK_B64_END",
  "python3 tools/verify_ggen_standards.py",
  "cargo fmt --all -- --check",
  "cargo metadata --locked --format-version 1 --no-deps",
]

[verification]
command = "bash .github/scripts/run-verification-matrix.sh"

[portable]
os = ["ubuntu-22.04", "macos-14", "windows-2022"]
commands = [
  "cargo check --locked --all-targets",
  "cargo test --locked --lib",
]

[real_toolchain]
os = ["ubuntu-22.04", "macos-14"]
test = "cargo test --locked --test adversarial_real_toolchains -- --nocapture --test-threads=1"

[groq]
tests = [
  "real_groq_chicago_e2e",
  "real_groq_ctq",
  "real_groq_executive_projection",
  "real_groq_mcp_handler",
  "real_groq_plan_workflow",
  "real_groq_powl",
  "real_groq_powl_refine",
  "real_groq_solution_spec",
]
